[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dierpian"
version = "0.1.0"
description = "Procedural geometric shapes dataset with multimodal retrieval utilities"
authors = [{name = "AutoGenerated"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pillow",
    "pandas",
    "networkx",
    "scikit-learn"
]

[project.optional-dependencies]
notebook = [
    "jupyter",
    "matplotlib",
    "seaborn"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
